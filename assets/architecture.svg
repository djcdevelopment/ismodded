<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 26px; font-weight: 800; fill: #f9fafb; letter-spacing: 0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: #9ca3af; }
    .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; }
    .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
    .code-text { font-family: "Cascadia Code", "Fira Code", Consolas, monospace; font-size: 11px; fill: #e2e8f0; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; }
  </style>

  <!-- Background -->
  <rect width="1200" height="780" fill="url(#bg)" />
  <rect width="1200" height="780" fill="none" stroke="#1f2937" stroke-width="1" />

  <!-- Grid lines (subtle) -->
  <g stroke="#1f2937" stroke-width="0.5" stroke-dasharray="4 8" opacity="0.4">
    <line x1="60" y1="120" x2="1140" y2="120" />
    <line x1="60" y1="420" x2="1140" y2="420" />
    <line x1="300" y1="120" x2="300" y2="720" />
    <line x1="600" y1="120" x2="600" y2="720" />
    <line x1="900" y1="120" x2="900" y2="720" />
  </g>

  <!-- Header -->
  <g transform="translate(60, 45)">
    <text class="title" x="0" y="0">Valheim 1.0 :: How isModded Blocks Achievements (And How We Fix It)</text>
    <text class="subtitle" x="0" y="24">A visual architectural guide explaining why modded sessions disable achievements and how a 20-line Harmony patch restores them.</text>
  </g>

  <!-- ==================== TRACK 1: VANILLA 1.0 BLOCKED PATH ==================== -->
  <g transform="translate(60, 110)">
    <!-- Section Border -->
    <rect width="1080" height="280" rx="12" fill="url(#redGlow)" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.5" />
    
    <rect x="20" y="16" width="170" height="24" rx="6" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1" />
    <text class="badge" x="28" y="32" fill="#f87171">Vanilla 1.0 Behavior (Blocked)</text>

    <!-- Step 1: BepInEx Polite Flag -->
    <g transform="translate(25, 60)">
      <rect width="220" height="185" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="24" r="12" fill="#ef4444" fill-opacity="0.2" />
      <text class="box-title" x="20" y="29" fill="#f87171" font-size="13">1</text>
      <text class="box-title" x="46" y="28" fill="#f1f5f9">BepInEx Chainloader</text>
      <text class="box-desc" x="16" y="56">Mod loader starts up.</text>
      <text class="box-desc" x="16" y="74">Honoring Iron Gate's request,</text>
      <text class="box-desc" x="16" y="92">it sets the modded flag:</text>
      <rect x="12" y="110" width="196" height="55" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.5" />
      <text class="code-text" x="20" y="130" fill="#38bdf8">// BepInEx Chainloader:</text>
      <text class="code-text" x="20" y="148" fill="#fbbf24">Game.isModded = true;</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 255 152 L 285 152" stroke="#ef4444" stroke-width="2" marker-end="url(#redArrow)" />

    <!-- Step 2: Player In-Game Action -->
    <g transform="translate(295, 60)">
      <rect width="220" height="185" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="24" r="12" fill="#ef4444" fill-opacity="0.2" />
      <text class="box-title" x="20" y="29" fill="#f87171" font-size="13">2</text>
      <text class="box-title" x="46" y="28" fill="#f1f5f9">In-Game Progression</text>
      <text class="box-desc" x="16" y="56">Player earns an achievement:</text>
      <text class="box-desc" x="16" y="74">• Defeats a Boss / Mob</text>
      <text class="box-desc" x="16" y="92">• Crafts gear / picks crops</text>
      <rect x="12" y="110" width="196" height="55" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.5" />
      <text class="code-text" x="20" y="130" fill="#94a3b8">PlayerProfile.</text>
      <text class="code-text" x="20" y="148" fill="#e2e8f0">IncrementStat(...);</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 525 152 L 555 152" stroke="#ef4444" stroke-width="2" />

    <!-- Step 3: Achievements Gate -->
    <g transform="translate(565, 60)">
      <rect width="250" height="185" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.2" />
      <circle cx="24" cy="24" r="12" fill="#ef4444" fill-opacity="0.2" />
      <text class="box-title" x="20" y="29" fill="#f87171" font-size="13">3</text>
      <text class="box-title" x="46" y="28" fill="#f1f5f9">The isModded Check</text>
      <text class="box-desc" x="16" y="56">Game checks if cheated/modded:</text>
      <rect x="12" y="70" width="226" height="100" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.5" />
      <text class="code-text" x="20" y="90" fill="#94a3b8">// Achievements.IsCheatedAtAll:</text>
      <text class="code-text" x="20" y="108" fill="#e2e8f0">if (cheatedDevcommands) { ... }</text>
      <text class="code-text" x="20" y="126" fill="#e2e8f0">else {</text>
      <text class="code-text" x="28" y="144" fill="#f87171">  cache = Game.isModded;</text>
      <text class="code-text" x="20" y="160" fill="#e2e8f0">}</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <path d="M 825 152 L 855 152" stroke="#ef4444" stroke-width="2" />

    <!-- Step 4: The Outcome (Blocked) -->
    <g transform="translate(865, 60)">
      <rect width="190" height="185" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" />
      <circle cx="24" cy="24" r="12" fill="#ef4444" />
      <text class="box-title" x="20" y="29" fill="#ffffff" font-size="13">4</text>
      <text class="box-title" x="46" y="28" fill="#fca5a5">BLOCKED!</text>
      <text class="box-desc" x="16" y="60" fill="#fecaca">CanGetAchievements()</text>
      <text class="box-desc" x="16" y="78" fill="#fca5a5">returns FALSE.</text>
      
      <g transform="translate(16, 100)">
        <rect width="158" height="65" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="0.5" />
        <text class="box-title" x="12" y="24" fill="#fee2e2" font-size="13">❌ No Steam Unlock</text>
        <text class="box-desc" x="12" y="44" fill="#fca5a5">Stats discarded.</text>
        <text class="box-desc" x="12" y="58" fill="#fca5a5">Menu says "Modded".</text>
      </g>
    </g>
  </g>

  <!-- ==================== TRACK 2: ISMODDED / HARMONY RESTORED PATH ==================== -->
  <g transform="translate(60, 420)">
    <!-- Section Border -->
    <rect width="1080" height="310" rx="12" fill="url(#greenGlow)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5" />
    
    <rect x="20" y="16" width="190" height="24" rx="6" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
    <text class="badge" x="28" y="32" fill="#34d399">The Harmony Fix (Restored)</text>

    <!-- Step 1: IsModded Plugin Loads -->
    <g transform="translate(25, 60)">
      <rect width="220" height="215" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="24" r="12" fill="#10b981" fill-opacity="0.2" />
      <text class="box-title" x="20" y="29" fill="#34d399" font-size="13">A</text>
      <text class="box-title" x="46" y="28" fill="#f1f5f9">IsModded Plugin</text>
      <text class="box-desc" x="16" y="56">A tiny 8.7 KB BepInEx mod</text>
      <text class="box-desc" x="16" y="74">loads alongside your favorite</text>
      <text class="box-desc" x="16" y="92">mods (Comfy, Valheim+, etc.)</text>
      <rect x="12" y="120" width="196" height="75" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.5" />
      <text class="code-text" x="20" y="142" fill="#34d399">[BepInPlugin(</text>
      <text class="code-text" x="28" y="160" fill="#38bdf8">  "djc.valheim.ismodded",</text>
      <text class="code-text" x="28" y="178" fill="#38bdf8">  "IsModded", "1.0")</text>
      <text class="code-text" x="20" y="190" fill="#34d399">]</text>
    </g>

    <!-- Arrow A -> B -->
    <path d="M 255 165 L 285 165" stroke="#10b981" stroke-width="2" />

    <!-- Step 2: Harmony Prefix Intercepts -->
    <g transform="translate(295, 60)">
      <rect width="280" height="215" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
      <circle cx="24" cy="24" r="12" fill="#10b981" fill-opacity="0.2" />
      <text class="box-title" x="20" y="29" fill="#34d399" font-size="13">B</text>
      <text class="box-title" x="46" y="28" fill="#f1f5f9">Harmony Prefix Interceptor</text>
      <text class="box-desc" x="16" y="56">Hooks Achievements.IsCheatedAtAll():</text>
      <rect x="12" y="70" width="256" height="135" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.5" />
      <text class="code-text" x="20" y="90" fill="#38bdf8">// Check REAL cheats:</text>
      <text class="code-text" x="20" y="106" fill="#e2e8f0">bool devCheats = profile.m_usedCheats;</text>
      <text class="code-text" x="20" y="122" fill="#e2e8f0">bool worldCheats = IsWorldCheated();</text>
      <text class="code-text" x="20" y="138" fill="#e2e8f0">bool itemCheats = AnyCheatedItem();</text>
      <text class="code-text" x="20" y="160" fill="#34d399">// Decouple Game.isModded!</text>
      <text class="code-text" x="20" y="176" fill="#4ade80">cache = devCheats || world || items;</text>
      <text class="code-text" x="20" y="194" fill="#fbbf24">__result = cache; return false;</text>
    </g>

    <!-- Arrow B -> C -->
    <path d="M 585 165 L 615 165" stroke="#10b981" stroke-width="2" />

    <!-- Step 3: Achievements Restored -->
    <g transform="translate(625, 60)">
      <rect width="210" height="215" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="24" r="12" fill="#10b981" fill-opacity="0.2" />
      <text class="box-title" x="20" y="29" fill="#34d399" font-size="13">C</text>
      <text class="box-title" x="46" y="28" fill="#f1f5f9">Valid Execution</text>
      <text class="box-desc" x="16" y="56">If not using devcommands:</text>
      <text class="box-desc" x="16" y="74">• IsCheatedAtAll() = false</text>
      <text class="box-desc" x="16" y="92">• CanGetAchievements() = true</text>
      <rect x="12" y="120" width="186" height="75" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.5" />
      <text class="code-text" x="20" y="142" fill="#94a3b8">SteamPlatform.</text>
      <text class="code-text" x="20" y="158" fill="#e2e8f0">AchievementManager</text>
      <text class="code-text" x="20" y="174" fill="#4ade80">.Unlock(achId);</text>
    </g>

    <!-- Arrow C -> D -->
    <path d="M 845 165 L 875 165" stroke="#10b981" stroke-width="2" />

    <!-- Step 4: Steam Success -->
    <g transform="translate(885, 60)">
      <rect width="170" height="215" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <circle cx="24" cy="24" r="12" fill="#10b981" />
      <text class="box-title" x="20" y="29" fill="#ffffff" font-size="13">D</text>
      <text class="box-title" x="46" y="28" fill="#a7f3d0">UNLOCKED!</text>
      <text class="box-desc" x="16" y="60" fill="#d1fae5">Native Steam API</text>
      <text class="box-desc" x="16" y="78" fill="#a7f3d0">executes successfully.</text>
      
      <g transform="translate(14, 100)">
        <rect width="142" height="95" rx="6" fill="#047857" stroke="#10b981" stroke-width="1" />
        <text class="box-title" x="10" y="26" fill="#ecfdf5" font-size="13">🏆 Steam Pop-Up</text>
        <text class="box-desc" x="10" y="48" fill="#d1fae5">100% Legit Progress</text>
        <text class="box-desc" x="10" y="66" fill="#d1fae5">Works with ALL mods</text>
        <text class="box-desc" x="10" y="84" fill="#d1fae5">Zero VAC / Ban risk</text>
      </g>
    </g>
  </g>
</svg>
